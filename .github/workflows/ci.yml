name: CI

on: [push]

jobs:
  build-macos-arm64:
    runs-on: macos-15
    strategy:
      matrix:
        assertions: [ON, OFF]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Verify native runner
      run: test "$(uname -s)" = Darwin && test "$(uname -m)" = arm64
    - name: Install dependencies
      run: |
        brew install llvm@20 ninja cmake
        python3 -m venv test-env
        test-env/bin/pip install lit==20.1.8
    - name: Configure
      run: |
        llvm_prefix=$(brew --prefix llvm@20)
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
          -DCMAKE_C_COMPILER="$llvm_prefix/bin/clang" \
          -DCMAKE_CXX_COMPILER="$llvm_prefix/bin/clang++" \
          -DLLVM_DIR="$llvm_prefix/lib/cmake/llvm" \
          -DTPDE_ENABLE_ASSERTIONS=${{ matrix.assertions }} \
          -DTPDE_ENABLE_ASAN=OFF -DLIT="$PWD/test-env/bin/lit;--output=$PWD/build/test-results.json"
    - name: Build and test
      run: |
        cmake --build build --target check-tpde --parallel 3
        python3 -c 'import json; tests = {t["name"]: t["code"] for t in json.load(open("build/test-results.json"))["tests"]}; required = ["TPDE :: macho.tir", "TPDE-LLVM :: macho/interoperability.test"]; assert all(tests.get(name) == "PASS" for name in required), tests'


  build-llvm19:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: sudo apt install -y ninja-build cmake clang-19 libclang-19-dev llvm-19-dev doxygen
    - name: Configure
      run: CC=clang CXX=clang++ cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTPDE_BUILD_DOCS=ON -DLIT=/usr/lib/llvm-19/build/utils/lit/lit.py
    - name: Build
      run: ninja -v -C build
    - name: Test
      run: ninja -v -C build check-tpde

  build-llvm20:
    runs-on: ubuntu-latest
    container: t0b1fox/tpde
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure
      run: CC=clang-20 CXX=clang++-20 cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTPDE_BUILD_DOCS=ON -DLIT=/usr/bin/lit 
    - name: Build
      run: ninja -v -C build
    - name: Test
      run: ninja -v -C build check-tpde
    - name: Upload docs as artifact
      if: github.ref == 'refs/heads/master'
      id: deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: build/docs/html/

  deploy-docs:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: build-llvm20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  license-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: pip3 install --user reuse
    - name: Check
      run: reuse lint
