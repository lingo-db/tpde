# Tests in this directory exercise the Mach-O / Apple Silicon back-end
# specifically (LLVMCompilerArm64Darwin). They produce Mach-O `.o`
# output, so they UNSUPPORTED-skip on Linux hosts where that
# back-end isn't built.
if 'tpde-llvm-arm64-darwin' not in config.available_features:
    config.unsupported = True
